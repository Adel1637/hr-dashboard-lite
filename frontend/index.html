<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard RH</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/plotly.min.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div>
          <div class="brand-name" id="brand-name"></div>
          <div class="brand-sub" id="brand-company"></div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="prefs">
          <select class="input" id="lang-select" data-i18n-title="common.language"></select>
          <button class="icon-btn" id="theme-btn" data-i18n-title="common.theme"></button>
        </div>
        <div class="user-chip">
          <div class="avatar" id="user-avatar"></div>
          <div style="min-width:0; flex:1">
            <div id="user-name" style="font-weight:600; overflow:hidden; text-overflow:ellipsis"></div>
            <div class="brand-sub" id="user-role"></div>
          </div>
          <button class="icon-btn" id="logout-btn" data-i18n-title="nav.logout"></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="mobile-bar">
        <button class="icon-btn" id="menu-btn" aria-label="Menu"></button>
        <strong id="mobile-title"></strong>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
