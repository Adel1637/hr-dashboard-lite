[project]
name = "kit-dashboard-rh-lite"
version = "0.1.0"
license = { text = "MIT" }
description = "HR headcount dashboard from Excel files (FastAPI + Pandas + Plotly) — Lite edition"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "plotly>=5.20",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
